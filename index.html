<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAPTAT</title>
<meta name="description" content="Une ligne par jour, des chapitres que tu fermes toi-même, et une grille de photos pour les retrouver.">

<meta name="theme-color" content="#EFECE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<!-- Politique de sécurité du contenu.
     Rien ne se charge d'ailleurs que de cette page, sauf les appels à
     Supabase. Aucun 'unsafe-inline' : pas un script ni un style en
     ligne dans tout le projet, et el() n'expose aucun innerHTML — donc
     même un texte piégé dans une de tes lignes ne peut pas devenir du
     code. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self';
  font-src 'self';
  img-src 'self' blob: data:;
  connect-src 'self' https://*.supabase.co wss://*.supabase.co;
  worker-src 'self';
  manifest-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none';
  frame-src 'none'">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RAPTAT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">
  <div class="stage">

    <!-- ── Écran 1 — Aujourd'hui ─────────────────────────────── -->
    <section class="screen" id="screen-today">
      <header class="top">
        <span class="wordmark" id="chapterlabel">Chapitre 1</span>
        <button type="button" class="more" id="moremenu" aria-label="Réglages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
        </button>
      </header>
      <div class="scroll" id="feed"></div>
    </section>

    <!-- ── Écran 2 — Chapitres ───────────────────────────────── -->
    <section class="screen" id="screen-chapters" hidden>
      <header class="top">
        <span class="screentitle">Chapitres</span>
        <span class="count" id="chaptercount"></span>
      </header>
      <div class="scroll">
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <!-- ── Écran 3 — Argent ──────────────────────────────────── -->
    <section class="screen" id="screen-money" hidden>
      <header class="top">
        <span class="screentitle">Argent</span>
        <span class="count" id="moneychapter"></span>
      </header>
      <div class="scroll">
        <div class="bigwrap">
          <div class="bignum in" id="bignum">+0,00 €</div>
          <div class="bigsub" id="bigsub"></div>
        </div>
        <div class="label">Par chapitre</div>
        <div id="bars"></div>
        <div class="label">Par projet</div>
        <div id="tags"></div>
      </div>
    </section>

    <!-- ── Les pages poussées (chapitre, projet, réglages) ────── -->
    <div id="pages" hidden></div>
  </div>

  <!-- ── Le bas de l'écran : message et saisie ───────────────── -->
  <div class="dock">
    <!-- Tant qu'aucun compte n'est branché, l'app le dit une fois, sans
         insister. Une fois connecté, cette ligne disparaît pour de bon. -->
    <div class="signin" id="signinbar" hidden>
      <span class="signintext" id="signintext"></span>
      <button type="button" class="signinbtn" id="signinbtn">Se connecter</button>
    </div>

    <div id="toasthost"></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="editbar" id="editbar" hidden>
        <span class="k">Modifier</span>
        <button type="button" id="editCancel">Annuler</button>
      </div>
      <div class="cbox">
        <textarea id="line" rows="1" placeholder="écris une ligne…"
          enterkeyhint="send" inputmode="text" autocapitalize="sentences"
          spellcheck="true" aria-label="Écris une ligne"></textarea>
        <button id="send" type="submit" aria-label="Envoyer" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </div>

  <!-- ── Les trois onglets. En bas sur un téléphone, en rail à
       gauche sur un écran large : la zone du pouce est une règle de
       téléphone, pas une règle de bureau. ───────────────────────── -->
  <nav class="tabs" aria-label="Navigation">
    <div class="raillogo">
      <svg class="railmark" viewBox="0 0 1682.58 961.1" fill="currentColor" role="img" aria-label="RAPTAT">

        <polygon points="1124.37 560.66 1093.23 644.38 1025.47 644.38 1025.47 961.1 927.18 961.1 927.18 644.38 822.7 644.38 822.7 560.65 1025.47 560.66 1124.37 560.66"/>
        <path d="M1646.46,105.09c-11.13-23.86-26.91-42.37-47.33-55.52-20.43-13.14-44.59-19.72-72.5-19.72s-53.6,6.58-73.42,19.72c-14.34,9.51-24.65,21.51-30.94,36v-49.65h-72.37l-16.82,433.81h91.01v-175.33c5.31,14.62,14.21,26.75,26.7,36.39,17.79,13.76,41.45,20.63,70.98,20.63s53.6-6.67,74.63-20.02c21.03-13.35,37.41-32.16,49.15-56.43,11.72-24.27,17.59-52.78,17.59-85.55s-5.56-60.46-16.68-84.33ZM1548.47,255.56c-13.35,15.37-30.74,23.05-52.18,23.05s-39.54-7.58-53.09-22.75-20.32-36.91-20.32-65.22,6.77-50.06,20.32-65.23,30.84-22.75,51.88-22.75,39.53,7.49,53.09,22.45c13.54,14.97,20.32,36.61,20.32,64.92s-6.67,50.16-20.02,65.53Z"/>
      </svg>
    </div>
      <button type="button" class="tab on" id="tab-today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Aujourd'hui</span>
      </button>
      <button type="button" class="tab" id="tab-chapters" aria-current="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
        <span>Chapitres</span>
      </button>
      <button type="button" class="tab" id="tab-money" aria-current="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6.5A6 6 0 0 0 8 9a6 6 0 0 0 9 8.5M5 10.5h8M5 13.5h8"/></svg>
        <span>Argent</span>
      </button>
  </nav>
</div>

<p id="boot">RAPTAT s'ouvre…</p>

<script type="module" src="js/main.js"></script>
</body>
</html>
