<h2>Ta connexion</h2>

<p>Ouvre ce lien si tu lis ce message sur l'appareil que tu veux connecter :</p>

<p><a href="{{ .ConfirmationURL }}">Se connecter</a></p>

<p>Sinon — et c'est le cas si l'app est installée sur ton écran
d'accueil — tape plutôt ce code dans l'app :</p>

<p style="font-size:30px;letter-spacing:.25em;font-family:monospace"><strong>{{ .Token }}</strong></p>

<p style="color:#6C6B67;font-size:13px">Le code vaut une heure. Si tu n'as rien demandé, ignore ce message.</p>
