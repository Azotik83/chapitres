# Configuration Supabase — volontairement minimale.
#
# `supabase config push` n'écrit QUE les propriétés déclarées ici et
# laisse le reste intact. On ne déclare donc que les deux réglages dont
# l'app a besoin, plutôt que le gabarit complet de `supabase init` :
# celui-ci réécrirait au passage des valeurs distantes qu'on ne veut pas
# toucher (le CLI met lui-même en garde contre ce cas).
#
# Sans ces deux lignes, le lien de connexion reçu par courriel renvoie
# vers localhost:3000, le réglage d'usine de Supabase.

project_id = "ziskwkobxfikcbybinny"

[auth]
site_url = "https://azotik83.github.io/chapitres/"
additional_redirect_urls = ["https://azotik83.github.io/chapitres/"]

# NOTE — le gabarit de courriel (supabase/templates/magic_link.html)
# est prêt mais NON déclaré ici, volontairement : Supabase refuse toute
# modification de gabarit sur l'offre gratuite tant qu'on utilise son
# service d'envoi intégré. Le jour où un SMTP personnalisé est branché,
# décommenter les trois lignes ci-dessous suffit à envoyer un code en
# plus du lien.
#
# [auth.email.template.magic_link]
# subject = "Ton code de connexion"
# content_path = "./supabase/templates/magic_link.html"
